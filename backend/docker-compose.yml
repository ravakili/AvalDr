services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avaldr
      POSTGRES_USER: avaldr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avaldr_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avaldr -d avaldr']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - '8000:8000'
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_NAME: avaldr
      DB_USER: avaldr
      DB_PASSWORD: ${DB_PASSWORD:-avaldr_secret}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RETURN_OTP_IN_DEBUG: ${RETURN_OTP_IN_DEBUG:-True}

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
